server:
  port: 8080

spring:
  application:
    name: crop-disease-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
      resolve-lazily: false

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 8000

cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"

logging:
  level:
    root: INFO
    com.cropprotect.backend: DEBUG
