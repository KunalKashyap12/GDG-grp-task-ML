# Dataset Mapping Configuration for Local Crop Disease Detector
# Maps diverse raw dataset folder names to standardized Crop___Disease format.
# Capped at 1500 images per class during merge.

target_classes:
  # Tomato (PlantVillage / PlantDoc)
  - "Tomato___Bacterial_spot"
  - "Tomato___Early_blight"
  - "Tomato___Late_blight"
  - "Tomato___Leaf_Mold"
  - "Tomato___Septoria_leaf_spot"
  - "Tomato___Yellow_Leaf_Curl_Virus"
  - "Tomato___Healthy"
  # Potato (PlantVillage / PlantDoc)
  - "Potato___Early_blight"
  - "Potato___Late_blight"
  - "Potato___Healthy"
  # Maize / Corn (PlantVillage / PlantDoc)
  - "Maize___Common_rust"
  - "Maize___Gray_leaf_spot"
  - "Maize___Northern_Leaf_Blight"
  - "Maize___Healthy"
  # Bell Pepper (PlantVillage / PlantDoc)
  - "Bell_Pepper___Bacterial_spot"
  - "Bell_Pepper___Healthy"
  # Grape (PlantVillage / PlantDoc)
  - "Grape___Black_rot"
  - "Grape___Esca_Black_Measles"
  - "Grape___Leaf_blight"
  - "Grape___Healthy"
  # Apple (PlantVillage / PlantDoc)
  - "Apple___Apple_scab"
  - "Apple___Black_rot"
  - "Apple___Cedar_apple_rust"
  - "Apple___Healthy"
  # Rice (Kaggle Rice Leaf Disease)
  - "Rice___Bacterial_leaf_blight"
  - "Rice___Brown_spot"
  - "Rice___Leaf_blast"
  - "Rice___Healthy"
  # Wheat (Kaggle Wheat Disease / CGIAR)
  - "Wheat___Brown_rust"
  - "Wheat___Yellow_rust"
  - "Wheat___Septoria"
  - "Wheat___Healthy"
  # Cotton (Kaggle Cotton Disease)
  - "Cotton___Bacterial_blight"
  - "Cotton___Curl_virus"
  - "Cotton___Fusarium_wilt"
  - "Cotton___Healthy"
  # Sugarcane (Kaggle Sugarcane Disease)
  - "Sugarcane___Red_rot"
  - "Sugarcane___Mosaic"
  - "Sugarcane___Healthy"

